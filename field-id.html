<script>
/* The Field ID Fabricator only lives inside the Field Notes notebook
   (its Field ID page -> Make Field ID), embedded with ?embed=1 in an
   iframe marked data-dg-embed -- the third tab of the old Agent Portal,
   moved. Opened any other way it forwards into the notebook for the
   same Agent, the way requisition.html does.
     ?code=CODE      load that Agent (name, photo, era)
     ?agency=&era=   start on this agency/era (the notebook's card) */
(function () {
  var fe = null;
  try { fe = window.frameElement; } catch (e) { fe = null; }
  var params = new URLSearchParams(location.search);
  if ((fe && fe.hasAttribute && fe.hasAttribute('data-dg-embed')) || params.get('embed') === '1') {
    document.documentElement.classList.add('fid-embedded');
    return;
  }
  var code = params.get('code');
  if (code) { try { localStorage.setItem('dg_stats_cloud_code', code.trim().toUpperCase()); } catch (e) { /* best effort */ } }
  if (fe && fe.id === 'dg-shell-content') {
    try { sessionStorage.setItem('dg_fn_open', 'fab'); } catch (e) { /* best effort */ }
    location.replace('agent-hub.html');
    return;
  }
  location.replace('hub.html?fn=fab');
})();
</script>

<style>
/* The Field ID Fabricator (v3.9.0): a forger's terminal. One question a
   step; what's known is already filled in; dice roll the rest. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#3fbf3f;--g2:#7fff7f;--gd:#1f6f1f;--gl:#e8ffe8;--bg:#060a06;--line:#1a3a1a;--dim:#2a8a2a}
html,body{background:#0a0d08}
body{padding:16px;font:13px 'Courier Prime',monospace;color:var(--g)}
html.fid-embedded,html.fid-embedded body{background:transparent}
html.fid-embedded body{padding:4px 6px 12px}
#ids-shell{background:#0b100b;border-radius:16px;padding:10px;box-shadow:inset 0 0 0 2px #222,0 6px 20px rgba(0,0,0,.6);max-width:1180px;margin:0 auto}
.fx-screen{background:var(--bg);border:1px solid var(--line);border-radius:6px;min-height:560px;display:flex;flex-direction:column;
  background-image:repeating-linear-gradient(transparent 0 3px,rgba(60,255,60,.025) 3px 4px)}
.fx-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.2em}
.fx-dots{display:flex;gap:6px;align-items:center;white-space:nowrap}.fx-dots i{width:22px;height:4px;background:#163016}.fx-dots i.on{background:var(--g)}.fx-dots i.done{background:var(--gd)}
.fx-body{flex:1;padding:20px 26px 22px}
.fx-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:rgba(0,0,0,.4)}
.fx-q{font:21px 'Special Elite',monospace;color:var(--gl);letter-spacing:.06em;margin-bottom:4px}
.fx-sub{color:#2a9a2a;font-size:12px;margin-bottom:16px}
.tl{color:var(--g2);margin:3px 0;letter-spacing:.04em;font-size:14px}.tl.dim{color:var(--dim);font-size:12.5px}
.cur{animation:fxbl 1s steps(1) infinite;margin-left:4px}@keyframes fxbl{50%{opacity:0}}
.topts{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-width:820px}
.topt{display:flex;align-items:center;gap:14px;border:1px solid #1f5a1f;padding:10px 14px;cursor:pointer;background:none;color:inherit;font:inherit;text-align:left;width:100%}
.topt:hover,.topt:focus-visible{border-color:var(--g2);background:rgba(60,200,60,.08);outline:none}
.topt[disabled]{opacity:.45;cursor:not-allowed}
.topt .tk{font:18px 'Special Elite',monospace;color:var(--g2);flex:none}
.topt .tt{flex:1;min-width:0}.topt .tt b{display:block;font:15px 'Special Elite',monospace;letter-spacing:.12em;color:var(--gl);font-weight:400}.topt .tt span{font-size:12px;color:#2fae2f}
.topt .tart{flex:none;width:86px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
.lbl{font-size:10px;letter-spacing:.18em;color:var(--dim);margin:14px 0 6px;text-transform:uppercase}
.lbl:first-child{margin-top:0}
.in{width:100%;background:#071207;border:1px solid #1f5a1f;color:var(--gl);padding:9px 11px;font:15px 'Courier Prime',monospace;border-radius:0}
.in.big{font:19px 'Special Elite',monospace;letter-spacing:.04em}
select.in{appearance:auto}
.in:focus{outline:1px solid var(--g2)}
.row{display:flex;gap:8px;align-items:stretch}.row > .in{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #1f5a1f;padding:7px 11px;font:11.5px 'Courier Prime',monospace;letter-spacing:.06em;color:var(--g);background:none;cursor:pointer}
.chip.on{border-color:var(--g2);color:var(--gl);background:#1f4f1f}
.dice{display:inline-flex;align-items:center;justify-content:center;min-width:44px;border:1px solid var(--g);font-size:21px;color:var(--g2);background:none;cursor:pointer;flex:none}
.btn{font:12px 'Special Elite',monospace;letter-spacing:.14em;text-transform:uppercase;padding:11px 18px;border:1px solid var(--g);color:var(--g);background:transparent;cursor:pointer}
.btn.go{background:var(--gd);color:var(--gl);border-color:var(--g2)}
.btn.ghost{border-color:#1f5a1f;color:var(--dim)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hint{font-size:11px;color:#1f8f1f;letter-spacing:.04em;margin-top:6px}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.cardshadow{box-shadow:0 12px 30px rgba(0,0,0,.7);border-radius:6px;line-height:normal}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick{border:1px solid #1f5a1f;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;background:none;color:inherit;font:inherit}
.pick.on{border-color:var(--g2);box-shadow:0 0 0 1px var(--g2),0 0 16px rgba(80,255,80,.2)}
.pick .nm{font-size:10.5px;letter-spacing:.1em;color:#2fae2f;text-align:center}
.th{width:100%;aspect-ratio:1.713;background:#ddd center/cover no-repeat;border-radius:2px}
.th.v{width:46%;aspect-ratio:.69}
.logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:420px}
.logo{background:#f6f4ec;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid transparent;cursor:pointer;padding:12%}
.logo.on{border-color:var(--g2);box-shadow:0 0 18px rgba(80,255,80,.25)}
.wal{font-size:10.5px;letter-spacing:.16em;display:flex;align-items:center;gap:8px}
.wal button{background:none;border:0;color:var(--g2);font-size:19px;cursor:pointer;padding:0 6px}
.err{color:#ff7a5a;font-size:12px;margin-top:8px;min-height:1em}
#fid-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;max-width:calc(100vw - 32px);background:#1c1608;color:#f4eed8;border:1px solid #8a7a5a;padding:10px 18px;font:13px/1.45 'Courier Prime',monospace;opacity:0;transition:opacity .25s;pointer-events:none}
@media (max-width:640px){
  body{padding:6px}#ids-shell{padding:6px;border-radius:12px}
  .fx-body{padding:14px 12px 16px}.fx-hd{font-size:8.5px;letter-spacing:.1em}
  .split{grid-template-columns:1fr}.grid,.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topt .tart{display:none}.fx-q{font-size:18px}
  .fx-foot .btn{flex:1}
}
</style>

<body>
<div id="ids-shell"><div class="fx-screen">
  <div class="fx-hd"><span id="fx-title">&#9650; COVER ID FABRICATOR // UNSANCTIONED BUILD</span><span class="fx-dots" id="fx-dots"></span></div>
  <div class="fx-body" id="fx-body"><div class="tl dim">&gt; boot fabricator.sys ...<span class="cur">_</span></div></div>
  <div class="fx-foot" id="fx-foot"></div>
</div></div>
<input type="file" id="fx-file" accept="image/png,image/svg+xml,image/jpeg" hidden>
<div id="fid-toast" role="status"></div>

<script src="assets/dg-store.js"></script>
<script src="assets/agencies.js"></script>
<script src="assets/field-id-cards.js"></script>
<script src="assets/forge-cards.js"></script>
<script>
(function () {
  'use strict';
  var F = window.dgForge, C = window.dgFieldIdCards, A = window.dgAgencies;
  var P = new URLSearchParams(location.search);
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxF32nCIUfXDcTaKntKkt8az_7mwy8aOAKPD0mtaEZHcUEKmq0AF2b2k4V6FJNEzbIJZQ/exec';
  var ERAS = [['90s', '1990s'], ['00s', '2000s'], ['10s', '2010s'], ['20s', '2020s']];
  var NO_90S = { ICE: 1, CBP: 1 };
  var esc = F.esc;
  // Inside the notebook, the page's own store: already signed in and warm.
  function store() {
    try { if (window.parent !== window && window.parent.dgStore) return window.parent.dgStore; } catch (e) { /* not ours */ }
    return window.dgStore;
  }
  function toast(msg) {
    var t = document.getElementById('fid-toast');
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.opacity = '0'; }, 3500);
  }

  var S = {
    code: (P.get('code') || '').trim().toUpperCase(),
    agency: (P.get('agency') || '').toUpperCase(), era: P.get('era') || '20s',
    brief: null, photo: '', stock: null, stockErr: '',
    wallet: { cards: [], carried: 'auto' }, walletLoaded: false,
    view: 'start', step: 1, d: null, editing: null, at: 0, err: ''
  };
  function agentName() { return (S.brief && S.brief.char_name) || ''; }
  function codename() { return (S.brief && S.brief.codename) || ''; }
  function ag() { return A.byCode(S.agency) || null; }
  function refUrl(file) { return (S.stock && S.stock[file]) || ''; }
  // The employer's own credential: always the wallet's first card.
  function autoCard() {
    var a = ag();
    return { id: 'auto', proto: 'mirror', agency: a ? a.code : 'DG', era: S.era,
      fields: { name: agentName(), title: a ? a.title : (codename() ? 'AGENT “' + codename() + '”' : 'AGENT'), id_num: S.code, era: S.era } };
  }
  function cards() { return [autoCard()].concat(S.wallet.cards || []); }
  function cardLabel(c) {
    if (c.id === 'auto') return (ag() ? ag().abbr : 'PROGRAM') + ' CREDENTIAL';
    if (c.proto === 'mirror') { var a = A.byCode(c.agency); return (a ? a.abbr : c.agency || 'DG') + ' CREDENTIAL'; }
    if (c.proto === 'office') { var r = F.ref(c.tpl); var place = (c.fields || {}).place; return ((place ? place + ' ' : '') + (r ? r.label : 'OFFICE')).toUpperCase(); }
    return String(c.org || 'SHELL ENTITY').toUpperCase();
  }
  function cardHtml(c, opts) { opts = opts || {}; return F.render(c, { photo: S.photo, refUrl: refUrl, print: opts.print }); }
  function fitted(c, w) { var sz = F.size(c); return F.fit(cardHtml(c), sz, Math.min(w, sz.w * 1.6)); }
  function previewWidth(max) { return Math.max(200, Math.min(max, (document.getElementById('fx-body').clientWidth || 700) - 40)); }

  /* ── Frame ── */
  function setHead(step, total, done) {
    var d = document.getElementById('fx-dots');
    if (!total) { d.innerHTML = '<span>LINK: ENCRYPTED · <span style="color:#d33">●</span> REC OFF</span>'; return; }
    var h = '';
    for (var i = 1; i <= total; i++) h += '<i class="' + (done || i < step ? 'done' : i === step ? 'on' : '') + '"></i>';
    d.innerHTML = h + '&nbsp; ' + (done ? 'DONE' : 'STEP ' + step + '/' + total);
  }
  function walletStrip() {
    var n = cards().length, i = Math.min(S.at, n - 1);
    return '<div class="wal">WALLET <button type="button" data-x="wprev" aria-label="Previous card">‹</button> ' + (i + 1) + ' OF ' + n +
      ' <button type="button" data-x="wnext" aria-label="Next card">›</button> <span style="opacity:.6">· EYES ONLY</span></div>';
  }
  function T(q, s) { return '<div class="fx-q">&gt; ' + q + '</div><div class="fx-sub">' + s + '</div>'; }
  function paint(body, foot) {
    document.getElementById('fx-body').innerHTML = body;
    document.getElementById('fx-foot').innerHTML = foot;
  }
  function render() {
    var v = S.view;
    if (v === 'start') return viewStart();
    if (v === 'mirror') return viewMirror();
    if (v === 'office') return S.step === 1 ? viewOfficePick() : viewOfficeFill();
    if (v === 'entity') return [viewEntityName, viewEntityLogo, viewEntityLayout, viewEntityProof][S.step - 1]();
    if (v === 'done') return viewDone();
    if (v === 'wallet') return viewWallet();
  }

  /* ── Start: the protocol ── */
  function viewStart() {
    setHead(0, 0);
    var a = ag(), stockN = S.stock ? F.REFS.filter(function (r) { return S.stock[r.file]; }).length : 0;
    var opt = function (n, x, t, d, art, dis) {
      return '<button type="button" class="topt" data-x="' + x + '"' + (dis ? ' disabled' : '') + '><span class="tk">[' + n + ']</span><span class="tt"><b>' + t + '</b><span>' + d + '</span></span><span class="tart">' + art + '</span></button>';
    };
    var mini = function (c) { return F.fit(cardHtml(c), F.size(c), 86); };
    paint(
      '<div class="tl dim">&gt; boot fabricator.sys ............ OK</div>' +
      '<div class="tl dim">&gt; bypass issuing-authority check .. OK</div>' +
      '<div class="tl dim">&gt; operator: ' + esc((agentName() || 'UNKNOWN').toUpperCase()) + ' // ' + esc(S.code || 'NO CODE') + ' // cover employer: ' + esc(a ? a.abbr : 'none on file') + '</div>' +
      '<div class="tl dim">&gt; stock on file: ' + (S.stock ? stockN : (S.stockErr ? 'unreachable' : '...')) + ' · insignia synth: online · photo: ' + (S.photo ? 'face plate loaded' : 'none on file') + '</div>' +
      '<div class="tl">&gt; SELECT FORGERY PROTOCOL<span class="cur">_</span></div>' +
      '<div class="topts">' +
        opt(1, 'p-mirror', 'MIRROR CREDENTIAL', a ? 'Copy your cover employer’s ID. ' + esc(a.abbr) + ' · ' + esc(a.title) + ' · your face.' : 'Copy any agency’s ID: pick the agency, your face goes on it.', mini(autoCard())) +
        opt(2, 'p-office', 'SPOOF A LOCAL OFFICE', S.stock && !stockN ? 'No stock on file yet. Your Handler loads it in A-Cell.' : 'A sheriff, a city, a fire company, a lab. Real stock, your name.', '', S.stock && !stockN) +
        opt(3, 'p-entity', 'FABRICATE AN ENTITY', 'A company that never existed. Name it, synthesize a logo.', '<div style="width:46px;height:46px;background:#f6f4ec;padding:3px;margin-left:20px">' + F.logo({ shape: 'ring', pal: F.PALS[0], name: 'MEADOWBROOK GASWORKS', kind: 'energy' }) + '</div>') +
      '</div>' +
      '<div class="tl dim" style="margin-top:18px">&gt; nothing here is legal. burn what you don’t use.</div>',
      walletStrip() + '<span class="hint" style="margin:0">PRESS 1 · 2 · 3 OR TAP</span>');
  }

  /* ── [1] Mirror credential ── */
  function newMirror() {
    var a = ag() || A.list[0];
    return { proto: 'mirror', agency: a.code, era: S.era, fields: { name: agentName(), title: a.title, id_num: F.roll.badge() + '-' + F.roll.badge() + '-' + F.roll.badge().slice(0, 2), expiry: '12/' + (2026 + Math.floor(Math.random() * 3)), detail: '' } };
  }
  function viewMirror() {
    setHead(1, 1);
    var d = S.d, f = d.fields;
    var opts = A.list.map(function (a) { return '<option value="' + a.code + '"' + (a.code === d.agency ? ' selected' : '') + '>' + esc(a.name) + ' (' + esc(a.abbr) + ')</option>'; }).join('') +
      '<option value="DG"' + (d.agency === 'DG' ? ' selected' : '') + '>Delta Green — Directorate</option>';
    paint(T('MIRROR CREDENTIAL', 'Pulled from your cover file. Check the print, change the era if the op needs it.') +
      '<div class="split"><div>' +
        '<div class="lbl">AGENCY</div><select class="in" data-in="agency" id="ids-agency">' + opts + '</select>' +
        '<div class="lbl">ERA ON THE CARD</div><div class="chips">' + ERAS.map(function (e) { return '<button type="button" class="chip' + (d.era === e[0] ? ' on' : '') + '" data-x="era" data-v="' + e[0] + '"' + (e[0] === '90s' && NO_90S[d.agency] ? ' disabled title="Not founded yet"' : '') + '>' + e[1] + '</button>'; }).join('') + '</div>' +
        '<div class="lbl">NAME · TITLE</div><input class="in" data-in="f.name" id="ids-cover-name" value="' + esc(f.name) + '"><input class="in" style="margin-top:6px" data-in="f.title" id="ids-cover-title" value="' + esc(f.title) + '">' +
        '<div class="lbl">ID NUMBER · EXPIRES</div><div class="row"><input class="in" data-in="f.id_num" id="ids-cover-id" value="' + esc(f.id_num) + '"><input class="in" style="max-width:110px" data-in="f.expiry" id="ids-cover-expiry" value="' + esc(f.expiry) + '"><button type="button" class="dice" data-x="roll-id" aria-label="Roll an ID number">⚄</button></div>' +
        '<div class="lbl">OFFICE / BADGE / RANK</div><input class="in" data-in="f.detail" id="ids-cover-detail" value="' + esc(f.detail) + '" placeholder="e.g. Kansas City Field Office">' +
        photoNote() +
      '</div><div class="stage" id="fx-prev">' + previewHtml(d, 470) + '</div></div>',
      backBtn() + '<button type="button" class="btn go" data-x="file">▸ PRINT TO WALLET</button>');
  }
  function photoNote() {
    return S.photo ? '' : '<div class="hint">No face plate on file. Take your Agent’s photo on Agent Hub; it goes on every card.</div>';
  }
  function previewHtml(c, w) { return '<div class="cardshadow">' + fitted(c, previewWidth(w)) + '</div>'; }
  function refreshPreview() { var p = document.getElementById('fx-prev'); if (p && S.d) p.innerHTML = previewHtml(S.d, S.view === 'office' ? 480 : 470); }

  /* ── [2] Spoof a local office ── */
  function viewOfficePick() {
    setHead(1, 2);
    var cur = S.d && S.d.tpl;
    paint(T('SELECT STOCK TO SPOOF', 'Genuine card stock, lifted. Pick the office you’ll pass for.') +
      (S.stock ? '' : '<div class="hint">' + (S.stockErr ? 'Stock unreachable: ' + esc(S.stockErr) : 'Pulling stock…') + '</div>') +
      '<div class="grid">' + F.REFS.map(function (r) {
        var u = refUrl(r.file);
        return '<button type="button" class="pick' + (cur === r.key ? ' on' : '') + '" data-x="tpl" data-v="' + r.key + '"' + (u ? '' : ' disabled style="opacity:.35"') + '>' +
          '<span class="th' + (r.type === 'badge' ? ' v' : '') + '" style="' + (u ? 'background-image:url(&quot;' + esc(u) + '&quot;)' : '') + '"></span><span class="nm">' + esc(r.label.toUpperCase()) + '</span></button>';
      }).join('') + '</div>',
      backBtn() + '<button type="button" class="btn go" data-x="next"' + (cur ? '' : ' disabled') + '>NEXT ›</button>');
  }
  function newOffice(key) {
    var r = F.ref(key), f = {};
    r.fields.forEach(function (x) {
      if (x.k === 'name') f.name = (key.indexOf('sheriff') === 0 ? '' : '') + agentName();
      else if (x.opts) f[x.k] = x.opts[0];
      else if (x.roll) f[x.k] = F.roll[x.roll](agentName());
      else f[x.k] = '';
    });
    return { proto: 'office', tpl: key, fields: f };
  }
  function viewOfficeFill() {
    setHead(2, 2);
    var d = S.d, r = F.ref(d.tpl), f = d.fields;
    var title = r.key.indexOf('sheriff') === 0 ? ['JURISDICTION // RANK', 'Pick a county nobody will call. Pick a rank nobody will question.'] : ['FILL THE STOCK', 'Your name is in. Roll what you don’t want to invent.'];
    paint(T(title[0], title[1]) + '<div class="split"><div>' + r.fields.map(function (x) {
        var v = f[x.k] || '';
        if (x.opts) return '<div class="lbl">' + esc(x.label) + '</div><div class="chips">' + x.opts.map(function (o) { return '<button type="button" class="chip' + (o === v ? ' on' : '') + '" data-x="opt" data-k="' + x.k + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
        return '<div class="lbl">' + esc(x.label) + '</div><div class="row"><input class="in' + (x.k === 'place' ? ' big' : '') + '" data-in="f.' + x.k + '" value="' + esc(v) + '">' +
          (x.roll ? '<button type="button" class="dice" data-x="roll" data-k="' + x.k + '" data-r="' + x.roll + '" aria-label="Roll ' + esc(x.label) + '">⚄</button>' : '') + '</div>';
      }).join('') + photoNote() +
      '</div><div class="stage"><div id="fx-prev">' + previewHtml(d, 480) + '</div><span class="hint">PROOF UPDATES LIVE</span></div></div>',
      backBtn() + '<button type="button" class="btn go" data-x="file">▸ PRINT TO WALLET</button>');
  }

  /* ── [3] Fabricate an entity ── */
  function newEntity() {
    return { proto: 'entity', org: '', kind: 'energy', tag: '', logo: null, layout: 'rule', name: agentName(), title: '', phone: F.roll.phone(), mail: '', _batch: 0, _pal: 0 };
  }
  function viewEntityName() {
    setHead(1, 4);
    var d = S.d;
    paint(T('REGISTER SHELL ENTITY', 'Name the front. Pick what it pretends to do.') +
      '<div style="max-width:720px"><div class="lbl">NAME</div><div class="row"><input class="in big" data-in="org" value="' + esc(d.org) + '" placeholder="e.g. Meadowbrook Gasworks"><button type="button" class="dice" data-x="roll-org" aria-label="Invent a name">⚄</button></div>' +
      '<div class="lbl">WHAT IT PRETENDS TO DO</div><div class="chips">' + F.KINDS.map(function (k) { return '<button type="button" class="chip' + (k.key === d.kind ? ' on' : '') + '" data-x="kind" data-v="' + k.key + '">' + esc(k.label) + '</button>'; }).join('') + '</div>' +
      '<div class="hint" style="margin-top:12px">The kind steers the insignia (a flame for energy, a cross for a church) and the job titles.</div><div class="err" id="fx-err">' + esc(S.err) + '</div></div>',
      backBtn() + '<button type="button" class="btn go" data-x="next">NEXT ›</button>');
  }
  // The words a kind gives, until the player changes them.
  function entityDefaults(d) {
    var k = F.kind(d.kind);
    if (!d.title) d.title = k.titles[0];
    if (!d.tag) d.tag = k.tags[0];
    if (!d.mail) d.mail = F.roll.mail(d.org, d.name);
  }
  function viewEntityLogo() {
    setHead(2, 4);
    var d = S.d, ch = F.logoChoices(d.org, d.kind, d._batch, d._pal);
    entityDefaults(d);
    if (!d.logo) d.logo = ch[0];
    var same = function (a, b) { return a && b && !a.img && a.shape === b.shape && String(a.pal) === String(b.pal); };
    paint(T('SYNTHESIZE INSIGNIA', 'Six marks for ' + esc(d.org) + '. Take one, or burn them and roll again.') +
      '<div class="split"><div class="logos">' + ch.map(function (l, i) { return '<button type="button" class="logo' + (same(d.logo, l) ? ' on' : '') + '" data-x="logo" data-i="' + i + '" aria-label="Logo ' + (i + 1) + '">' + F.logo(l) + '</button>'; }).join('') +
        (d.logo && d.logo.img ? '<button type="button" class="logo on" aria-label="Your logo">' + F.logo(d.logo) + '</button>' : '') + '</div>' +
      '<div><div class="lbl">NOT QUITE?</div><div class="row" style="flex-wrap:wrap"><button type="button" class="btn" data-x="logo-more">⟳ SIX MORE</button><button type="button" class="btn" data-x="logo-pal">◐ OTHER COLOURS</button></div>' +
        '<div class="lbl" style="margin-top:22px">HAVE YOUR OWN?</div><button type="button" class="btn ghost" data-x="logo-up">⇪ UPLOAD PNG / SVG</button>' +
        '<div class="err" id="fx-err">' + esc(S.err) + '</div></div></div>',
      backBtn() + '<button type="button" class="btn go" data-x="next">NEXT ›</button>');
  }
  function viewEntityLayout() {
    setHead(3, 4);
    var d = S.d, w = Math.min(300, Math.floor((previewWidth(1000) - 40) / (window.innerWidth < 640 ? 1 : 3)));
    paint(T('SELECT LAYOUT', 'Same lie, six faces. Pick the one that looks boring enough.') +
      '<div class="grid g3" style="' + (window.innerWidth < 640 ? 'grid-template-columns:1fr' : '') + '">' + F.LAYOUTS.map(function (L) {
        var c = Object.assign({}, d, { layout: L.key });
        return '<button type="button" class="pick' + (d.layout === L.key ? ' on' : '') + '" data-x="layout" data-v="' + L.key + '">' + F.fit(cardHtml(c), F.size(c), w) + '<span class="nm">' + esc(L.label.toUpperCase()) + '</span></button>';
      }).join('') + '</div>',
      backBtn() + '<button type="button" class="btn" data-x="shuffle">⚄ SHUFFLE</button><button type="button" class="btn go" data-x="next">NEXT ›</button>');
  }
  function viewEntityProof() {
    setHead(4, 4);
    var d = S.d, k = F.kind(d.kind);
    entityDefaults(d);
    paint(T('FINAL PROOF', 'Give yourself a job title. Roll a number that rings somewhere.') +
      '<div class="split"><div>' +
        '<div class="lbl">JOB TITLE</div><div class="chips">' + k.titles.map(function (t) { return '<button type="button" class="chip' + (t === d.title ? ' on' : '') + '" data-x="etitle" data-v="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div>' +
        '<input class="in" style="margin-top:6px" data-in="title" value="' + esc(d.title) + '" aria-label="Job title">' +
        '<div class="lbl">NAME</div><input class="in" data-in="name" value="' + esc(d.name) + '">' +
        '<div class="lbl">PHONE · E-MAIL</div><div class="row"><input class="in" data-in="phone" value="' + esc(d.phone) + '"><button type="button" class="dice" data-x="roll-phone" aria-label="Roll a phone number">⚄</button></div>' +
        '<input class="in" style="margin-top:6px" data-in="mail" value="' + esc(d.mail) + '">' +
        '<div class="lbl">TAGLINE</div><input class="in" data-in="tag" value="' + esc(d.tag) + '">' + photoNote() +
      '</div><div class="stage"><div id="fx-prev">' + previewHtml(d, 480) + '</div></div></div>',
      backBtn() + '<button type="button" class="btn go" data-x="file">▸ PRINT TO WALLET</button>');
  }

  /* ── Done, and the wallet ── */
  function viewDone() {
    var c = cards()[S.at] || cards()[0], total = S.lastTotal || 1;
    setHead(total, total, true);
    paint('<div class="tl dim">&gt; render proof ................... OK</div><div class="tl dim">&gt; age stock, scuff edges ........... OK</div>' +
      '<div class="tl dim">&gt; embed photo: ' + (S.photo ? 'face plate' : 'none on file') + ' ............. OK</div>' +
      '<div class="tl">&gt; FORGERY COMPLETE // ' + esc(cardLabel(c)) + ' // FILED TO WALLET [' + (S.at + 1) + ' OF ' + cards().length + ']<span class="cur">_</span></div>' +
      '<div class="stage" style="margin-top:16px">' + previewHtml(c, 420) + '</div>' + cardActions(c) +
      '<p class="hint" style="text-align:center">“Carry this one” puts it in your notebook pocket. Paper prints carry a small PROP line.</p>',
      walletStrip() + '<button type="button" class="btn ghost" data-x="home">WIPE &amp; CLOSE</button>');
  }
  function cardActions(c) {
    var carried = (S.wallet.carried || 'auto') === c.id;
    return '<div class="row" style="flex-wrap:wrap;justify-content:center;margin-top:16px">' +
      '<button type="button" class="btn go" data-x="carry"' + (carried ? ' disabled' : '') + '>' + (carried ? '★ CARRIED' : '★ CARRY THIS ONE') + '</button>' +
      '<button type="button" class="btn" data-x="print">⎙ PRINT</button>' +
      '<button type="button" class="btn" data-x="rework">✎ REWORK</button>' +
      (c.id === 'auto' ? '' : '<button type="button" class="btn ghost" data-x="burn">✕ BURN</button>') +
      '<button type="button" class="btn ghost" data-x="home">＋ FORGE ANOTHER</button></div>';
  }
  function viewWallet() {
    var list = cards(), c = list[S.at] || list[0];
    setHead(0, 0);
    paint('<div class="tl">&gt; WALLET // ' + esc(cardLabel(c)) + ' [' + (S.at + 1) + ' OF ' + list.length + ']' + ((S.wallet.carried || 'auto') === c.id ? ' // CARRIED' : '') + '</div>' +
      '<div class="stage" style="margin-top:16px">' + previewHtml(c, 420) + '</div>' + cardActions(c),
      walletStrip() + '<button type="button" class="btn ghost" data-x="home">BACK TO THE TERMINAL</button>');
  }
  function backBtn() { return '<button type="button" class="btn ghost" data-x="back">‹ BACK</button>'; }

  /* ── Saving ── */
  function persist() {
    var st = store();
    if (!S.code || !st || !st.saveWallet) return Promise.resolve();
    return st.saveWallet(S.code, S.wallet).then(function () {
      try { window.parent.dispatchEvent(new CustomEvent('dg-wallet-changed', { detail: { code: S.code } })); } catch (e) { /* not in the notebook */ }
    }, function (err) { toast('Could not save the wallet: ' + (err && err.message || err)); throw err; });
  }
  function clean(d) {
    var c = JSON.parse(JSON.stringify(d));
    Object.keys(c).forEach(function (k) { if (k.charAt(0) === '_') delete c[k]; });
    return c;
  }
  function fileDraft() {
    var c = clean(S.d);
    c.id = S.editing || ('c' + Date.now().toString(36));
    c.created_at = Date.now();
    var list = S.wallet.cards || (S.wallet.cards = []);
    var i = list.findIndex(function (x) { return x.id === c.id; });
    if (S.editing === 'auto') { /* the employer card can't be rewritten: file a copy */ c.id = 'c' + Date.now().toString(36); i = -1; }
    if (i >= 0) list[i] = c; else list.push(c);
    S.lastTotal = S.view === 'mirror' ? 1 : S.view === 'office' ? 2 : 4;
    S.at = cards().findIndex(function (x) { return x.id === c.id; });
    S.editing = null; S.view = 'done';
    render();
    persist().catch(function () {});
  }

  /* ── Events ── */
  function go(view, step, draft) { S.view = view; S.step = step || 1; if (draft !== undefined) S.d = draft; S.err = ''; render(); window.scrollTo(0, 0); }
  function setIn(path, v) {
    var d = S.d;
    if (!d) return;
    if (path.indexOf('f.') === 0) d.fields[path.slice(2)] = v;
    else if (path === 'agency') { d.agency = v; var a = A.byCode(v); if (a) d.fields.title = a.title; if (NO_90S[v] && d.era === '90s') d.era = '00s'; render(); return; }
    else d[path] = v;
    // A new name: new insignia and address to match.
    if (path === 'org') { d.logo = null; d.mail = ''; if (S.err) { S.err = ''; var er = document.getElementById('fx-err'); if (er) er.textContent = ''; } }
    refreshPreview();
  }
  document.addEventListener('input', function (e) { var p = e.target.getAttribute && e.target.getAttribute('data-in'); if (p) setIn(p, e.target.value); });
  document.addEventListener('change', function (e) { var p = e.target.getAttribute && e.target.getAttribute('data-in'); if (p && e.target.tagName === 'SELECT') setIn(p, e.target.value); });
  document.addEventListener('keydown', function (e) {
    if (S.view !== 'start' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === '1') act('p-mirror'); else if (e.key === '2') act('p-office'); else if (e.key === '3') act('p-entity');
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-x]');
    if (!b || b.disabled) return;
    act(b.getAttribute('data-x'), b);
  });
  function act(x, b) {
    var d = S.d, v = b && b.getAttribute('data-v');
    switch (x) {
      case 'p-mirror': S.editing = null; return go('mirror', 1, newMirror());
      case 'p-office': S.editing = null; return go('office', 1, null);
      case 'p-entity': S.editing = null; return go('entity', 1, newEntity());
      case 'home': return go('start', 1, null);
      case 'back':
        if (S.view === 'mirror' || S.step === 1) return go('start', 1, null);
        return go(S.view, S.step - 1);
      case 'next':
        if (S.view === 'office') return go('office', 2, d && d.proto === 'office' && d.fields ? d : newOffice(d.tpl));
        if (S.view === 'entity') {
          if (S.step === 1 && !String(d.org || '').trim()) { S.err = 'Name the front first (or roll one).'; return render(); }
          return go('entity', S.step + 1);
        }
        return;
      case 'era': d.era = v; d.fields.era = v; return render();
      case 'roll-id': d.fields.id_num = F.roll.badge() + '-' + F.roll.badge() + '-' + F.roll.badge().slice(0, 2); return render();
      case 'tpl': S.d = { proto: 'office', tpl: v }; return render();
      case 'opt': d.fields[b.getAttribute('data-k')] = v; return render();
      case 'roll': d.fields[b.getAttribute('data-k')] = F.roll[b.getAttribute('data-r')](d.fields.name || agentName()); return render();
      case 'roll-org': d.org = F.roll.company(d.kind); d.logo = null; d.mail = ''; return render();
      case 'org-typed': return;
      case 'kind': d.kind = v; d.logo = null; d.title = ''; d.tag = ''; return render();
      case 'logo': d.logo = F.logoChoices(d.org, d.kind, d._batch, d._pal)[+b.getAttribute('data-i')]; return render();
      case 'logo-more': d._batch++; d.logo = null; return render();
      case 'logo-pal': d._pal++; d.logo = null; return render();
      case 'logo-up': return document.getElementById('fx-file').click();
      case 'layout': d.layout = v; return render();
      case 'shuffle':
        var L = F.LAYOUTS[Math.floor(Math.random() * F.LAYOUTS.length)].key;
        d.layout = L; d._pal = Math.floor(Math.random() * 10); d._batch = Math.floor(Math.random() * 50);
        if (!d.logo || !d.logo.img) d.logo = F.logoChoices(d.org, d.kind, d._batch, d._pal)[0];
        return render();
      case 'etitle': d.title = v; return render();
      case 'roll-phone': d.phone = F.roll.phone(); return render();
      case 'file': return fileDraft();
      case 'wprev': case 'wnext':
        var n = cards().length; S.at = (S.at + (x === 'wnext' ? 1 : n - 1)) % n; S.view = 'wallet'; return render();
      case 'carry':
        var c = cards()[S.at]; S.wallet.carried = c.id; render();
        return persist().then(function () { toast('Carried: ' + cardLabel(c).toLowerCase() + '.'); }, function () {});
      case 'burn':
        var cb = cards()[S.at];
        if (!cb || cb.id === 'auto') return;
        S.wallet.cards = S.wallet.cards.filter(function (y) { return y.id !== cb.id; });
        if (S.wallet.carried === cb.id) S.wallet.carried = 'auto';
        S.at = Math.max(0, S.at - 1); S.view = 'wallet'; render();
        return persist().then(function () { toast('Burned.'); }, function () {});
      case 'rework':
        var cr = JSON.parse(JSON.stringify(cards()[S.at]));
        S.editing = cr.id;
        if (cr.proto === 'mirror') return go('mirror', 1, cr);
        if (cr.proto === 'office') return go('office', 2, cr);
        cr._batch = 0; cr._pal = 0; return go('entity', 4, cr);
      case 'print':
        var cp = cards()[S.at];
        return F.print(cardHtml(cp, { print: true }), F.size(cp));
    }
  }
  // An uploaded logo: SVG as it is (small), a picture scaled to 256 px.
  document.getElementById('fx-file').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file || !S.d) return;
    var r = new FileReader();
    r.onload = function () {
      var url = String(r.result || '');
      if (/svg/.test(file.type)) {
        if (url.length > 160000) { S.err = 'That SVG is too big (keep it under ~120 KB).'; return render(); }
        S.d.logo = { img: url }; S.err = ''; return render();
      }
      var im = new Image();
      im.onload = function () {
        var k = Math.min(1, 256 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        S.d.logo = { img: cv.toDataURL('image/png') }; S.err = ''; render();
      };
      im.onerror = function () { S.err = 'Could not read that picture.'; render(); };
      im.src = url;
    };
    r.readAsDataURL(file);
  });
  window.addEventListener('resize', function () { clearTimeout(window._fxR); window._fxR = setTimeout(render, 150); });

  /* ── Loading: the Agent, their photo, the wallet, the stock ── */
  function loadFace(b) {
    var st = store(), face = st && st.mainPhoto ? st.mainPhoto(b) : (b.face_plate_url || '');
    if (!face) return;
    if (/^(https?:|data:)/.test(face) && !/drive\.google|gdrive:/.test(face)) { S.photo = face; return; }
    var m = String(face).match(/^gdrive:(.+)$/) || String(face).match(/\/file\/d\/([^\/\?]+)/) || String(face).match(/[?&]id=([^&]+)/);
    if (!m) return;
    var cb = '_fxFace' + Date.now();
    window[cb] = function (json) { delete window[cb]; if (json && json.status === 'OK' && json.dataUri) { S.photo = json.dataUri; render(); } };
    var s = document.createElement('script');
    s.src = APPS_SCRIPT_URL + '?action=imgdata&id=' + encodeURIComponent(m[1]) + '&callback=' + cb;
    document.head.appendChild(s);
  }
  function boot() {
    var st = store();
    render();
    if (!S.code || !st) return;
    st.getBrief(S.code).then(function (b) { if (b) { S.brief = b; loadFace(b); if (!S.agency && b.cover_agency) { var a = A.match(b.cover_agency); if (a) S.agency = a.code; } } render(); }, function () {});
    if (st.getWallet) st.getWallet(S.code).then(function (w) { if (w) S.wallet = { cards: w.cards || [], carried: w.carried || 'auto' }; S.walletLoaded = true; if (S.view === 'start' || S.view === 'wallet') render(); }, function () { S.walletLoaded = true; });
    if (st.idTemplates) st.idTemplates(S.code).then(function (m) { S.stock = m || {}; if (S.view === 'start' || S.view === 'office') render(); }, function (err) { S.stock = null; S.stockErr = (err && err.message) || 'error'; render(); });
  }
  window.dgFabricator = { state: function () { return S; }, act: act };
  boot();
})();
</script>
</body>
