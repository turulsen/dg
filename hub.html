<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Green — Hub</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/mars-tech-seal.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme-folder.css">
<style>
  /* ══════════════════════════════════════════════
     Phase 2/3/4 -- see docs/firebase-migration/ (shell plan) on this
     branch. This page owns Table Radio, Dice Roller, and the
     service-worker update banner once, for the tab's whole lifetime;
     everything else the app does still lives in the standalone pages,
     loaded here one at a time into #dg-shell-content instead of via a
     real page navigation -- Agent Hub is the default, loaded on a bare
     visit; ?start=a-cell.html (see index.html's own Clearance links)
     opens straight to A-Cell instead. Agent Hub/stats/Agent File all
     still include their own copies of table-radio.js/dice-roller.js
     too (unchanged, so they keep working exactly as before when
     visited standalone) -- both scripts detect they're running inside
     this exact iframe (window.frameElement.id === 'dg-shell-content')
     and skip mounting their own copy there, so only this page's
     hoisted widgets ever render, with no second pill sitting on top of
     the real one.

     Phase 3 -- real cross-frame nav (assets/shell-nav.js): a persistent
     top nav for the two top-level destinations (Agent Hub, A-Cell);
     deeper pages (Character Sheet, Agent File, Notes) are reached the
     normal way, via a link clicked inside whichever page is currently
     loaded -- a relative <a href> inside an iframe navigates that
     iframe on its own, no extra plumbing needed.

     Phase 4 -- linked live from index.html's own Clearance choices,
     replacing a real page navigation to agent-hub.html/a-cell.html.
     Still remaining: fold the rest of the site's own top-level nav (if
     any gets added later) into #dg-shell-nav too.
     ══════════════════════════════════════════════ */
  :root{ --term-green:#3ef07a; --term-green-dim:#1e7a42; }
  html,body{ height:100%; margin:0; }
  *{ box-sizing:border-box; }
  body{
    display:flex; flex-direction:column;
    background:#0a0d08; color:#d9d2b8;
    font-family:'Courier Prime',monospace;
  }
  #dg-shell-header{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:10px 16px; border-bottom:1px solid #3a4630;
    background:#11150d;
  }
  #dg-shell-header .brand{
    font-family:'Special Elite',monospace; font-size:13px; letter-spacing:.12em;
    text-transform:uppercase; color:#c8c1a8;
  }
  #dg-shell-nav{
    margin-left:auto; display:flex; gap:6px; align-items:center;
  }
  #dg-shell-nav button{
    font-family:'Courier Prime',monospace; font-size:11px; color:#c8c1a8;
    background:#1a1f16; border:1px solid #3a4630; padding:5px 10px; cursor:pointer;
    /* Same 4px as Table Radio's own small action buttons (.dgr-confirm/
       .dgr-btn in assets/table-radio.js) -- this had no radius at all
       before, sharp square corners next to every other widget-chrome
       button's rounded ones, reported as visibly inconsistent right
       next to Table Radio's own Tune In button in the same screenshot. */
    border-radius:4px;
  }
  #dg-shell-nav button:hover{ border-color:#6a7a4f; }
  #dg-shell-nav button.dg-shell-nav-active{
    background:#2a3a1c; border-color:#4a6a30; color:#d8f0c0;
  }
  #dg-shell-content-wrap{ flex:1; min-height:0; position:relative; }
  #dg-shell-content{
    display:block; width:100%; height:100%; border:0; background:#0a0d08;
  }
  /* Loading veil: a real report was "nothing indicates it clicked, and
     it takes a long time to load" -- most of that gap is this exact
     spot, between the tap on index.html's Clearance card landing here
     and the iframe's own content (fonts, its own scripts, Firestore
     sign-in, roster fetch) actually painting. Previously nothing at all
     covered that gap but the plain #0a0d08 background -- this shows
     immediately and clears once the iframe's own load event fires, so
     there's always visible confirmation something is happening instead
     of a blank wait.

     Black-screen/green-terminal, same aesthetic as index.html's boot
     splash and a-cell.html's own gate (both have their own copy of this
     look, not a shared element -- same convention here) -- a first pass
     tried the destination's own paper look instead, on the reasoning
     that landing on ANOTHER dark terminal screen felt like no progress
     was made; asked back for the terminal look specifically, styled as
     its own instance of it rather than reusing #boot-splash's element. */
  #dg-shell-loading{
    position:absolute; inset:0; z-index:5;
    display:flex; align-items:center; justify-content:center;
    background:#000; font-family:'JetBrains Mono',monospace;
    transition:opacity .25s ease; padding:20px;
  }
  #dg-shell-loading.dg-shell-loading-hidden{ opacity:0; pointer-events:none; }
  #dg-shell-loading-term{
    color:var(--term-green); font-size:clamp(13px,3vw,16px);
    line-height:1.9; text-shadow:0 0 8px rgba(62,240,122,.55);
    white-space:pre-wrap; text-align:left; max-width:420px; width:100%;
  }
  #dg-shell-loading-term .term-line{ white-space:pre; }
  #dg-shell-loading-input-line{ white-space:pre; }
  #dg-shell-loading-ci-input{
    background:transparent; border:none; outline:none; caret-color:var(--term-green);
    color:var(--term-green); font-family:'JetBrains Mono',monospace;
    font-size:inherit; text-shadow:0 0 8px rgba(62,240,122,.55);
    width:16ch; letter-spacing:.05em;
  }
  #dg-shell-loading-ci-input::placeholder{ color:var(--term-green-dim); text-shadow:none; }
  #dg-shell-loading .dg-shell-cursor{
    display:inline-block; width:.55em; height:1em; background:var(--term-green);
    vertical-align:text-bottom; margin-left:2px; animation:dg-shell-blink 1s step-end infinite;
  }
  @keyframes dg-shell-blink{ 50%{ opacity:0; } }
</style>
</head>
<body>

<div id="dg-shell-header">
  <span class="brand">Delta Green — Hub</span>
</div>

<div id="dg-shell-content-wrap">
  <iframe id="dg-shell-content" title="Delta Green content"></iframe>
  <div id="dg-shell-loading">
    <div id="dg-shell-loading-term">
      <div id="dg-shell-loading-log"></div>
      <div class="dg-shell-loading-input-line" id="dg-shell-loading-input-line">&gt;<input id="dg-shell-loading-ci-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60" placeholder="your real name, or Enter to skip"><span class="dg-shell-cursor"></span></div>
    </div>
  </div>
</div>

<script>
  // Explicit allowlist, not a bare pass-through of ?start= into the
  // iframe's src -- a crafted link (?start=https://evil.example) would
  // otherwise load an arbitrary page inside the shell's own chrome.
  // Runs synchronously, right after the iframe is parsed and before any
  // deferred script (shell-nav.js's own initial active-tab read
  // included) -- the iframe only ever loads the one correct page, no
  // flash of Agent Hub before redirecting to A-Cell.
  (function () {
    var ALLOWED_START = ['agent-hub.html', 'a-cell.html'];
    var requested = new URLSearchParams(location.search).get('start');
    var initial = ALLOWED_START.indexOf(requested) !== -1 ? requested : 'agent-hub.html';
    var iframe = document.getElementById('dg-shell-content');
    var veil = document.getElementById('dg-shell-loading');
    var log = document.getElementById('dg-shell-loading-log');
    var inputLine = document.getElementById('dg-shell-loading-input-line');
    var input = document.getElementById('dg-shell-loading-ci-input');

    function addLine(text) {
      if (!log) return;
      var div = document.createElement('div');
      div.className = 'term-line';
      div.textContent = '>' + text;
      log.appendChild(div);
    }

    // The iframe's own load event fires once its document (fonts,
    // scripts, initial synchronous render) has actually finished --
    // not a fixed timer, so a slow connection keeps the veil up for as
    // long as it genuinely needs to, and a fast one doesn't wait around
    // for nothing. This veil only ever shows for THIS initial boot in
    // from index.html's Clearance screen -- a real report asked for
    // that specifically: shell-nav.js's own Agent Hub <-> A-Cell tab
    // switch used to bring it back too, and a link clicked inside the
    // loaded page (Agent File, Notes, etc.) never did, but reappearing
    // for an ordinary in-app tab switch read as an unwelcome new wait
    // for something that used to feel instant, not "makes sense" the
    // way the very first entry does. armVeil() below is only ever
    // called from this one boot sequence now.
    //
    // Hard cap, same reasoning as index.html's own boot splash ("no
    // matter how the animation above paces out, never hold the splash
    // past ~8.6s total"): a live report showed the veil never clearing
    // at all -- the Cover Identity preload's own log even showed
    // agents_loaded successfully, so the page was reachable, but the
    // iframe's load event apparently never fired (a slow/flaky mobile
    // connection dropping just that event, not reproducible from this
    // sandbox). Without this, that's a hard trap: the veil has no other
    // way off. Armed only around an actual iframe.src assignment (via
    // armVeil() below), never while the Cover Identity prompt is
    // genuinely waiting on typing -- that wait is supposed to be
    // open-ended, not a hang to time out of.
    var veilTimeout = null;
    var veilPoll = null;
    function disarmVeil() {
      if (veilTimeout) { clearTimeout(veilTimeout); veilTimeout = null; }
      if (veilPoll) { clearInterval(veilPoll); veilPoll = null; }
      if (veil) veil.classList.add('dg-shell-loading-hidden');
    }
    function armVeil() {
      if (!veil) return;
      veil.classList.remove('dg-shell-loading-hidden');
      if (veilTimeout) clearTimeout(veilTimeout);
      if (veilPoll) clearInterval(veilPoll);
      // Belt and suspenders: the 'load' event is the primary signal, but
      // the live report that led to this (agents_loaded showed in the
      // veil's own log, so the page was genuinely reachable, yet the
      // veil never cleared) points at that event occasionally just not
      // firing on some real devices/connections. A 300ms poll of the
      // iframe's own readyState catches that case directly instead of
      // depending on the possibly-missed event -- same-origin, so this
      // is always readable. Checking the URL too, not just readyState,
      // is required, not decorative: an iframe with no prior navigation
      // still has its original about:blank document sitting there
      // already 'complete' the instant .src is assigned, before the
      // real navigation has even committed -- readyState alone false-
      // positived on that stale document within the first poll tick,
      // hiding the veil almost immediately regardless of whether
      // agent-hub.html/a-cell.html had actually loaded. The hard-cap
      // timeout below still exists too, now short (6s) rather than a
      // device-only fallback -- both exist so a genuinely slow load
      // still gets the full benefit of the veil without a long,
      // unexplained wait once the page is already sitting there ready.
      veilPoll = setInterval(function () {
        try {
          if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete'
            && iframe.contentWindow.location.href.indexOf(initial) !== -1) disarmVeil();
        } catch (e) { /* cross-origin somehow -- shouldn't happen, same-origin site */ }
      }, 300);
      veilTimeout = setTimeout(disarmVeil, 6000);
    }
    if (veil) {
      iframe.addEventListener('load', disarmVeil);
    }

    // Cover Identity preload -- mirrors (deliberately duplicated, not
    // shared: same standalone-page convention this app already uses
    // everywhere, e.g. loadEvidencePhotoDataUri_'s own comment in
    // notes/notes.js) just the localStorage-merge half of agent-hub.html's
    // lookupCoverIdentity(). Its own copy still runs once it loads
    // regardless, as the source of truth and the fallback if this one's
    // request is somehow blocked or slower.
    function runCiPreload(name) {
      addLine('loading_agents_for_' + name.trim().toLowerCase().replace(/\s+/g, '_') + '…');
      try {
        var cbName = '_dgHubCiPreload_' + Date.now();
        window[cbName] = function (res) {
          delete window[cbName];
          var s = document.getElementById(cbName);
          if (s) s.remove();
          if (!res || res.status !== 'OK' || !Array.isArray(res.agents) || !res.agents.length) {
            addLine('no_agents_found');
            return;
          }
          try {
            var prior = JSON.parse(localStorage.getItem('dg_agent_roster') || '{}');
            var roster = {};
            Object.keys(prior).forEach(function (code) {
              if (!prior[code].player_name) roster[code] = prior[code];
            });
            var needle = name.trim().toLowerCase();
            res.agents.forEach(function (a) {
              if (!a.code) return;
              roster[a.code] = {
                code: a.code, char_name: a.char_name || '', codename: a.codename || '',
                sex: a.sex || '', age_range: a.age_range || '', nationality: a.nationality || '',
                active_eras: a.active_eras || '', face_plate_url: a.face_plate_url || '',
                campaign_era: a.campaign_era || '', player_name: a.player_name || needle,
                saved_at: a.saved_at || Date.now(),
              };
            });
            localStorage.setItem('dg_agent_roster', JSON.stringify(roster));
            localStorage.setItem('dg_cover_identity', name.trim());
            addLine('agents_loaded: ' + res.agents.length);
          } catch (e) { /* best effort -- agent-hub.html's own lookup still covers this */ }
        };
        var script = document.createElement('script');
        script.id = cbName;
        script.src = 'https://script.google.com/macros/s/AKfycbxF32nCIUfXDcTaKntKkt8az_7mwy8aOAKPD0mtaEZHcUEKmq0AF2b2k4V6FJNEzbIJZQ/exec'
          + '?action=find_by_player_name&name=' + encodeURIComponent(name) + '&callback=' + cbName;
        document.head.appendChild(script);
      } catch (e) { /* best effort -- localStorage unavailable (private mode etc.) */ }
    }

    function bootIframe() {
      armVeil();
      iframe.src = initial;
    }

    // Only the very first boot into Agent Hub asks -- not a real access
    // gate (there's nothing to deny), so Enter with nothing typed just
    // moves on. A remembered identity skips the prompt entirely and
    // preloads immediately, matching "always preloads the player's
    // agents" without making a returning player retype their name
    // every single visit; only a brand-new device/browser is ever
    // actually asked.
    if (initial === 'agent-hub.html' && log && inputLine && input) {
      addLine('enter_cover_identity:');
      var storedIdentity = '';
      try { storedIdentity = localStorage.getItem('dg_cover_identity') || ''; } catch (e) { /* best effort */ }
      if (storedIdentity) {
        inputLine.style.display = 'none';
        addLine(storedIdentity);
        runCiPreload(storedIdentity);
        bootIframe();
      } else {
        input.focus();
        input.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          var val = input.value.trim();
          input.disabled = true;
          inputLine.style.display = 'none';
          if (val) { addLine(val); runCiPreload(val); } else { addLine('(skipped)'); }
          bootIframe();
        });
      }
    } else {
      if (inputLine) inputLine.style.display = 'none';
      addLine('loading…');
      bootIframe();
    }
  })();
</script>
<script>
  // Small, explicit API any page loaded into #dg-shell-content can call
  // (via window.parent.dgShellSetWidgetsHidden -- same-origin, so this
  // is safe) to temporarily get the shell's own hoisted widgets out of
  // the way. Both #dg-radio and #dr-panel are position:fixed in THIS
  // document, so they paint over the ENTIRE content iframe
  // unconditionally, regardless of any z-index used inside it -- an
  // iframe boundary can't be crossed by CSS stacking context alone, no
  // matter how high a z-index the page inside it uses. First real case:
  // notes/notes.js's own Editor.js block-type picker (a mobile bottom
  // sheet) was rendering correctly but sitting BEHIND these widgets,
  // covered and unusable, once notes/index.html started loading inside
  // this shell.
  //
  // visibility:hidden, not display:none -- Table Radio's own audio/
  // video keeps playing either way (see its own header comment on why
  // Minimized uses height:0 + overflow:hidden instead of display:none,
  // same reasoning), only the visible chrome needs to duck out of the
  // way, never the playback itself.
  window.dgShellSetWidgetsHidden = function (hidden) {
    var radio = document.getElementById('dg-radio');
    var dice = document.getElementById('dr-panel');
    if (radio) radio.style.visibility = hidden ? 'hidden' : '';
    if (dice) dice.style.visibility = hidden ? 'hidden' : '';
  };
</script>
<script src="assets/table-radio.js"></script>
<script src="assets/dice-roller.js?v=4"></script>
<script src="assets/sw-update.js" data-sw="sw.js"></script>
<script src="assets/shell-nav.js"></script>

</body>
</html>
