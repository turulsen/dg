<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Green — Agent File</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/mars-tech-seal.png">
<script>
/* The three-tab Agent Portal is retired: each Agent's whole file
   (Appearance, era photos, the sheet, Evidence) is their tab on Agent
   Hub, and the Field ID Fabricator lives in the Field Notes notebook.
   Old links, bookmarks and A-Cell's "Take Photo" land in the right place:
     ?code=CODE            -> agent-hub.html?code=CODE
     ?code=CODE#cover      -> agent-hub.html?code=CODE#photos
                              (Take Photo; the Appearance brief first if
                              it isn't finished)
     ?code=CODE#ids        -> field-id.html?code=CODE (into the notebook)
     no code               -> agent-hub.html */
(function () {
  var code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
  var hash = location.hash;
  var q = code ? '?code=' + encodeURIComponent(code) : '';
  var to = hash === '#ids' ? 'field-id.html' + q
    : 'agent-hub.html' + q + (code && hash === '#cover' ? '#photos' : '');
  location.replace(to);
})();
</script>
</head>
<body style="background:#0a0d08;color:#c9d4b8;font:14px 'Courier New',monospace;padding:24px;">
  <noscript>The Agent File is on <a href="agent-hub.html" style="color:#a8c890">Agent Hub</a>.</noscript>
</body>
</html>
